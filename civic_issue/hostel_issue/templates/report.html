{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report a Problem Modal</title>
    <link rel="stylesheet" href="{% static 'report.css' %}">
</head>
<body>

    <div class="modal">
        <div class="modal-header">
            <h2>Report a Problem</h2>
            <div class="close-icon">&times;</div>
        </div>

        <form method="post" action="{% url 'report' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="title">Problem Title *</label>
                <input type="text" id="title" name="title" placeholder="Brief description of the issue">
            </div>

            <div class="form-group">
                <label for="description">Detailed Description *</label>
                <textarea id="description" name="description" placeholder="Provide more details about the problem..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group col">
                    <label for="category">Category *</label>
                    <select id="category" name="category">
                        <option value=" All Category">All Cetegory</option>
                        <option value="Water">Water</option>
                        <option value="Security">Security</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Plumbing">Plumbing</option>
                        <option value="Cleanliness">Cleanliness</option>"
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group col">
                    <label for="location">Location *</label>
                    <input type="text" id="location" name="location" placeholder="e.g., Block A, Floor 2">
                </div>
            </div>


            <div class="modal-footer">
                <a href="{% url 'user' %}" class="btn btn-cancel">Cancel</a>
                <button type="submit" class="btn btn-submit">Submit Report</button>
            </div>
        </form>
    </div>

</body>
</html>
